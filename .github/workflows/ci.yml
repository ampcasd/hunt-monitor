name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TibiaSquare.Desktop.sln

      - name: Build
        run: dotnet build TibiaSquare.Desktop.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TibiaSquare.Desktop.sln --configuration Release --no-build --filter FullyQualifiedName!~DiagnosticReportServiceTests
